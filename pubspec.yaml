name: launenfuchs
description: "Mood journal with free, honest stats — local-first."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.0.0
  intl: ^0.20.2

  # Local-first persistence.
  drift: ^2.34.0
  drift_flutter: ^0.3.0

  # Shared design system (theme, triad palette, Figtree, settings anatomy).
  # Pinned to a tag like the siblings: tags are stable fetch targets.
  fuchsbau:
    git:
      url: https://github.com/Kemenor/fuchsbau.git
      ref: v0.3.0

  material_symbols_icons: ^4.2951.0

  # Backup / import: ZIP in and out through the system dialogs (Fuchsbau
  # backup pattern — save dialog out, flutter_file_dialog in).
  archive: ^4.0.9
  flutter_file_dialog: ^3.3.1
  package_info_plus: ^10.2.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  local_auth: ^3.0.2
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.14.4

# App icon. Regenerate the layers with `python3 tool/make_icon.py
# assets/icon/launenfuchs_art.png assets/icon`, then `dart run
# flutter_launcher_icons`. Family recipe: full art for legacy/iOS, the
# transparent fox as the adaptive foreground on the app's triad colour
# (launenfuchs = indigo; checkfuchs = emerald). No monochrome layer on purpose.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/launenfuchs.png"
  adaptive_icon_background: "#8559D0"
  adaptive_icon_foreground: "assets/icon/launenfuchs_fg.png"
  # The foreground is already laid out for the 66 % safe zone (tool/make_icon.py),
  # so no extra inset on top.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 26
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true
