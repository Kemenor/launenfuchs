name: launenfuchs
description: "Mood journal with free, honest stats — local-first."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.0.0
  intl: ^0.20.2

  # Local-first persistence.
  drift: ^2.34.0
  drift_flutter: ^0.3.0

  # Shared design system (theme, triad palette, Figtree, settings anatomy).
  # Pinned to a tag like the siblings: tags are stable fetch targets.
  fuchsbau:
    git:
      url: https://github.com/Kemenor/fuchsbau.git
      ref: v0.3.0

  material_symbols_icons: ^4.2951.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.0

flutter:
  uses-material-design: true
  generate: true
